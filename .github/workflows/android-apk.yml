name: Build Annapurna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create CI signing keys
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass annapurna-ci-temporary \
            -alias upload \
            -keypass annapurna-ci-temporary \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Annapurna CI,O=Annapurna,C=IN"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=annapurna-ci-temporary" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=annapurna-ci-temporary" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --tests 'com.example.data.model.*' --tests 'com.example.util.*'

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -n 5

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: annapurna-customer-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
