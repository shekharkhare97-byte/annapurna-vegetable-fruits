name: Build Annapurna Customer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-delivery-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.annapurna --project-name annapurna_mobile .
          fi

      - name: Add location permissions
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest'
          insert = '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              s = s.replace('>', '>', 1)
              pos = s.find('>')
              s = s[:pos+1] + insert + s[pos+1:]
              p.write_text(s)
          PY

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: annapurna-customer-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
